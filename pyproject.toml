[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "kroc-act-emg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["lerobot[training]==0.6.1", "h5py>=3.11", "numpy>=2,<2.3", "rosbags>=0.11,<0.12"]

[tool.setuptools.packages.find]
where = ["src"]
